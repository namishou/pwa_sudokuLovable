<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>AIナンプレ</title>
    <script>
      // GitHub Pages SPA redirect hack for /pwa_sudokuLovable/ base path
      // Redirects all 404 requests to index.html with the path preserved
      const basePath = '/pwa_sudokuLovable';
      const pathSegmentsToKeep = 1; // Keep the repo name segment
      const l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath + '/?/' +
        l.pathname.slice(basePath.length + 1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
